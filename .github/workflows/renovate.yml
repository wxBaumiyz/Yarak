# SPDX-License-Identifier: MIT
# Self-hosted Renovate (Fallback, falls die Renovate-GitHub-App NICHT installiert wird):
# laeuft taeglich 03:00 UTC + manuell per workflow_dispatch. Nutzt renovate.json im Repo-Root.
# Voraussetzung: Secret RENOVATE_TOKEN im Repo anlegen (PAT classic mit `repo`-Scope).
# WICHTIG: Entweder die App ODER diesen Workflow nutzen - nicht beides (sonst doppelte PRs).

name: renovate

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
