# SPDX-License-Identifier: MIT
# CI fuer das reservations-Backend (Python): Lint (ruff) + Tests (pytest) aus dem
# hash-gepinnten Lockfile, dann Image-Build mit podman -> ghcr.io/wxbaumiyz/yarak

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/wxbaumiyz/yarak

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: install dev-lock (sha256-Hashes)
        run: python -m pip install --require-hashes -r reservations/requirements-dev.txt
      - name: ruff check
        run: ruff check reservations

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: install dev-lock (sha256-Hashes)
        run: python -m pip install --require-hashes -r reservations/requirements-dev.txt
      - name: pytest
        working-directory: reservations
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: login ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build image (python:3.12-slim)
        run: podman build -t "${{ env.IMAGE }}:latest" -t "${{ env.IMAGE }}:${{ github.sha }}" -f reservations/Containerfile reservations/
      - name: push image
        run: podman push "${{ env.IMAGE }}:latest" && podman push "${{ env.IMAGE }}:${{ github.sha }}"
