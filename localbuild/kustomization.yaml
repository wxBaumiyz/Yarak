# SPDX-License-Identifier: MIT
# Lokales Kustomize-Overlay: beltado-Basis (overlays/kind, remote) + LOKAL gebautes Image
# (localhost/yarak-reservations:v4 mit imagePullPolicy: Never) statt ghcr.io/wxbaumiyz/yarak.
# Deploy: kubectl apply -k localbuild/ -n beltado
# Registry-Variante (CI-Image): siehe ../kustomization/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://gitlab.com/biletado/kustomize.git//overlays/kind?ref=main

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: reservations
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: localhost/yarak-reservations:v4
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
