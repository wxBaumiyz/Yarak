# SPDX-License-Identifier: MIT
[project]
name = "biletado-reservations-v4"
version = "4.1.1"
description = "Backend fuer die biletado reservations-v4 REST-API (OpenAPI specs/v4/reservations-v4.yaml)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "yarak as rest api kubernetes" },
]
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
